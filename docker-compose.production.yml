# Файл docker-compose.production.yml

volumes:
  food_data_prod:
  static_volume:
  media_volume:

services:
  db:
    image: postgres:13.10
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: foodgram
    volumes:
      - food_data_prod:/var/lib/postgresql/data
  backend:
    image: vladimirradk/food_back
    env_file: .env
    depends_on:
      - db
    volumes:
      - static_volume:/backend_static
      - media_volume:/app/media
  frontend:
    image: vladimirradk/food_front
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static_volume:/frontend_static
  gateway:
    image: vladimirradk/food_gate
    volumes:
      - static_volume:/staticfiles/
      - media_volume:/app/media
      - ./docs:/docs
    ports:
      - 8500:80
    depends_on:
      - backend
    restart: always
