# Файл docker-compose.production.yml

volumes:
  food_data_prod:
  static_volume:
  media_volume:

services:
  db:
    image: postgres:13.10
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: foodgram
    volumes:
      - food_data_prod:/var/lib/postgresql/data
  backend:
    image: vladimirradk/food_back
    env_file: .env
    depends_on:
      - db
    volumes:
      - static_volume:/backend_static
      - media_volume:/app/media
  frontend:
    image: vladimirradk/food_front
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static_volume:/frontend_static
  gateway:
    image: nginx:alpine
    container_name: gateway
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      # Твой конфиг → default.conf, который Nginx точно прочитает
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      # Статика и медиа (пути должны совпадать с тем, куда Django их кладёт)
      - static_volume:/app/static
      - media_volume:/app/media
      - ./docs:/docs
    ports:
      - "8500:80"
    networks:
      - foodgram-network