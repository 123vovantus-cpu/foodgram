# Файл docker-compose.production.yml

volumes:
  food_data_prod:
  static_volume:
  media_volume:

services:
  db:
    image: postgres:13.10
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: foodgram
    volumes:
      - food_data_prod:/var/lib/postgresql/data
  backend:
    image: vladimirradk/food_back
    env_file: .env
    depends_on:
      - db
    volumes:
      - static_volume:/app/collected_static
      - media_volume:/app/media
  frontend:
    image: vladimirradk/food_front
    env_file: .env
    restart: unless-stopped
    expose:
      - "80"
    #command: cp -r /app/build/. /app/collected_static/
    #volumes:
    #  - static_volume:/app/collected_static
  gateway:
    image: nginx:alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt/live/food.jo3.org:/etc/nginx/ssl:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static_volume:/app/collected_static
      - media_volume:/app/media
      - ./docs:/docs:ro
    ports:
      - "8500:80"
      - "443:443"  
    restart: unless-stopped
    